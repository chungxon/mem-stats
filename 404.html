<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Page not found - MemStats</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121212" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/assets/icon.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<script>
(function () {
  try {
    var saved = localStorage.getItem('theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.dataset.theme = saved;
  } catch (e) {}
})();
</script>
<style>
:root {
  --bg: #f6f5f1; --surface: #ffffff; --text: #1b1b1a; --muted: #62625e;
  --line: #e0dfd8; --accent: #1a7f4b; --accent-text: #ffffff;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121212; --surface: #1c1c1b; --text: #f1f0ec; --muted: #a3a29c;
    --line: #2d2d2b; --accent: #3fb579; --accent-text: #08150e;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121212; --surface: #1c1c1b; --text: #f1f0ec; --muted: #a3a29c;
  --line: #2d2d2b; --accent: #3fb579; --accent-text: #08150e;
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center;
  background: var(--bg); color: var(--text);
  font-family: var(--font); font-size: 17px; line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
main { max-width: 440px; padding: 48px 16px; text-align: center; }
img { width: 72px; height: 72px; border-radius: 17px; }
.code { margin: 20px 0 0; font-size: 15px; font-weight: 600; color: var(--muted); }
h1 { margin: 4px 0 12px; font-size: 32px; line-height: 1.15; }
p { margin: 0; color: var(--muted); }
.cta { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-top: 28px; }
.btn {
  display: inline-block; padding: 11px 16px; border-radius: 10px; font-weight: 600; text-decoration: none;
  color: var(--text); background: var(--surface); border: 1px solid var(--line);
}
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: var(--accent); }
.btn:hover { filter: brightness(0.96); }
.btn:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <img src="/assets/icon.png" alt="MemStats app icon" width="72" height="72">
  <p class="code">404</p>
  <h1>Page not found</h1>
  <p>This page does not exist. It may have moved, or the link has a typo.</p>
  <div class="cta">
    <a class="btn primary" href="/">Go to MemStats</a>
    <a class="btn" href="https://github.com/chungxon/MemStats">View on GitHub</a>
  </div>
</main>
</body>
</html>
